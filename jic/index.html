<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <title>觀看紀錄月曆</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- <link rel="icon" href="./Jimmore_logo.ico"> -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />

 <style>
  /* =========================
     (A) 月曆外觀樣式
     用意：讓月曆可讀、星期有顏色、今天高亮
     ========================= */

  /* ✅ 關鍵：固定月曆每欄寬度，避免被文字撐開 */
  table.calendar {
    width: 100%;
    table-layout: fixed; /* ← 防跑版核心 */
  }

  .calendar th,
  .calendar td {
    text-align: center;
    height: 110px;
    vertical-align: top;
    overflow: hidden; /* 不讓內容撐開 cell */
  }

  .sun {
    color: #dc3545;
  }

  .sat {
    color: #0d6efd;
  }

  .today {
    background: #fff3cd;
    border-radius: 10px;
  }

  .cal-btn {
    min-width: 110px;
  }

  .day-cell {
    cursor: pointer;
  }

  .day-num {
    font-weight: 700;
  }

  /* =========================
     (B) 影片摘要區塊（灰底）
     用意：
     - 最多顯示 2 行
     - 長英文 / 沒空白字串也不會撐版
     ========================= */
  .event-text {
    margin-top: 6px;
    font-size: 0.85rem;
    text-align: left;
    background: #f1f3f5;
    border-radius: 6px;
    padding: 6px;

    /* ✅ 防跑版設定 */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    /* -webkit-line-clamp: 2;   顯示最多 2 行 */
    overflow: hidden;

    white-space: normal;     /* 允許換行 */
    word-break: break-word; /* 強制斷長字 */
    overflow-wrap: anywhere;
  }

  /* =========================
     (C) 行事曆備註（藍底）
     用意：
     - 與影片一致，不撐格子
     - 顯示例如「Q4季會（休息）」
     ========================= */
  .note-text {
    margin-top: 6px;
    font-size: 0.85rem;
    text-align: left;
    background: #e7f1ff;
    border: 1px solid #b6d4fe;
    border-radius: 6px;
    padding: 6px;

    /* ✅ 防跑版設定 */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    /* -webkit-line-clamp: 2; */
    overflow: hidden;

    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
</style>

</head>

<body class="bg-light">
  <div class="container my-4">
    <!-- =========================
         (B) 月曆掛載位置
         用意：只顯示「有 date 的影片」+「行事曆備註」
         ========================= -->
    <div id="calendarMount"></div>
  </div>

  <!-- =========================================================
       (D) 每週訓練影片區（自動生成）
       用意：
       - 把「沒有 date 的影片」放在這裡，讓你直接看
       - 你日後如果補上 date，該影片就會自動「從這裡消失」並進入月曆
       ========================================================= -->
  <div class="container my-5" id="trainingSection">
    <h2 class="mb-4 fw-bold">📺 每週訓練影片（未排日期）</h2>

    <!-- JS 會把未排日期影片自動渲染在這裡 -->
    <div id="trainingList" class="row g-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <!-- =========================================================
       (1) 影片資料庫（外部檔案）
       用意：
       - date 有值：代表你已排日期 → 顯示在月曆
       - date 空字串：代表未排 → 顯示在 (D) 區 iframe
       ========================================================= -->
  <script src="./videos.js"></script>

  <!-- =========================================================
       (1-2) 行事曆備註資料庫（非影片）
       用意：
       - 讓你可以在指定日期塞「會議/休假/提醒」
       - 例如：2026-01-12 顯示「Q4季會（休息）」
       ========================================================= -->
  <!-- <script>
    window.CALENDAR_NOTES = {
      "2026-01-12": "Q4季會（休息）",
      "2026-01-13": "Q4季會（休息）"

    };
  </script> -->

  <!-- =========================================================
       (2) 工具函式
       用意：
       - toKey：把日期組成 YYYY-MM-DD，作為資料 key
       - escapeHtml：避免文字內有特殊符號造成 HTML 破版
       - normalizeToWatchUrl：點月曆時用 watch 連結比較順
       - normalizeToEmbedUrl：用在 (D) 區 iframe 顯示
       ========================================================= -->
  <script>
    function toKey(y, m, d) {
      const mm = String(m + 1).padStart(2, "0");
      const dd = String(d).padStart(2, "0");
      return `${y}-${mm}-${dd}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // 讓點開影片更穩：embed / youtu.be 轉成 watch?v=
    function normalizeToWatchUrl(url) {
      const s = String(url || "");

      // embed -> watch
      const embedMatch = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]+)/);
      if (embedMatch) {
        return `https://www.youtube.com/watch?v=${embedMatch[1]}`;
      }

      // youtu.be -> watch (保留 query)
      const shortMatch = s.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
      if (shortMatch) {
        const query = s.includes("?") ? s.slice(s.indexOf("?")) : "";
        return `https://www.youtube.com/watch?v=${shortMatch[1]}${query}`;
      }

      return s;
    }

    // 用在 iframe：如果給的是 watch?v= 也能轉成 embed
    function normalizeToEmbedUrl(url) {
      const s = String(url || "");

      // 已經是 embed 直接回傳
      if (s.includes("youtube.com/embed/")) return s;

      // watch?v=xxxx -> embed/xxxx
      const watchMatch = s.match(/v=([a-zA-Z0-9_-]+)/);
      if (watchMatch) {
        return `https://www.youtube.com/embed/${watchMatch[1]}`;
      }

      // youtu.be/xxxx -> embed/xxxx
      const shortMatch = s.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
      if (shortMatch) {
        return `https://www.youtube.com/embed/${shortMatch[1]}`;
      }

      return s; // 其他來源就原樣
    }
  </script>

  <!-- =========================================================
       (3) 依 date 分組（只收有 date 的影片）
       用意：月曆只顯示「已排日期」影片
       ========================================================= -->
  <script>
    function groupVideosByDate(db) {
      const byDate = {};
      for (const v of db) {
        if (!v.date) continue;               // 沒日期 => 不進月曆
        (byDate[v.date] ||= []).push(v);     // 影片物件 그대로放入
      }
      return byDate;
    }
  </script>

  <!-- =========================================================
       (3-2) 依 date 分組（備註）
       用意：
       - 把 window.CALENDAR_NOTES 轉成 byDate 結構
       - 並標記 type="note" 讓月曆渲染時可以用藍色樣式
       ========================================================= -->
  <script>
    function groupNotesByDate(notesObj) {
      const byDate = {};
      const notes = notesObj || {};

      for (const dateKey in notes) {
        (byDate[dateKey] ||= []).push({
          type: "note",
          text: String(notes[dateKey] || "")
        });
      }
      return byDate;
    }

    function mergeByDate(a, b) {
      const out = { ...(a || {}) };
      for (const k in (b || {})) {
        out[k] = (out[k] || []).concat(b[k]);
      }
      return out;
    }
  </script>

  <!-- =========================================================
       (4) 月曆 UI 結構：標題/按鈕/表格骨架
       用意：只建一次骨架，換月時只更新 tbody
       ========================================================= -->
  <script>
    function buildCalendarSkeleton(rootEl) {
      rootEl.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button id="prevBtn" class="btn btn-outline-secondary cal-btn">← 上個月</button>
          <h3 id="calendarTitle" class="m-0"></h3>
          <button id="nextBtn" class="btn btn-outline-secondary cal-btn">下個月 →</button>
        </div>

        <table class="table table-bordered calendar bg-white">
          <thead class="table-secondary">
            <tr>
              <th class="sun">日</th>
              <th>一</th>
              <th>二</th>
              <th>三</th>
              <th>四</th>
              <th>五</th>
              <th class="sat">六</th>
            </tr>
          </thead>
          <tbody id="calendarBody"></tbody>
        </table>

        <div class="text-center mt-3">
          <button id="todayBtn" class="btn btn-primary">回到今天</button>
        </div>
      `;
    }
  </script>

  <!-- =========================================================
       (5) 月曆渲染：畫日期格 + 顯示「影片摘要 + 藍色備註」
       用意：
       - 影片：最多 2 行 + more
       - 備註：藍色區塊顯示（例如 Q4季會休息）
       ========================================================= -->
  <script>
    function renderCalendar({ year, month, byDate, realToday }) {
      const titleEl = document.getElementById("calendarTitle");
      const bodyEl = document.getElementById("calendarBody");

      titleEl.innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = "<tr>";
      for (let i = 0; i < firstDay; i++) html += "<td></td>";

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const weekDay = d.getDay();

        let cls = "day-cell";
        if (weekDay === 0) cls += " sun";
        if (weekDay === 6) cls += " sat";

        const isToday =
          year === realToday.getFullYear() &&
          month === realToday.getMonth() &&
          day === realToday.getDate();
        if (isToday) cls += " today";

        const key = toKey(year, month, day);
        const list = byDate[key] || [];

        // ✅ 分開：影片 vs 備註
        const videos = list.filter(x => x.type !== "note");
        const notes = list.filter(x => x.type === "note");

        let summary = "";

        // ✅ 影片摘要（灰底）
        if (videos.length) {
          const names = videos
            .slice(0, 2)
            // .map(v => `▶ ${escapeHtml(v.name)}`)
            .map(v => `▶`)
            .join("\n");

          const more = videos.length > 2 ? `\n…還有 ${videos.length - 2} 部` : "";
          summary += `<div class="event-text">${names}${more}</div>`;
        }

        // ✅ 行事曆備註（藍底）
        if (notes.length) {
          const noteText = notes.map(n => `🟦 ${escapeHtml(n.text)}`).join("\n");
          summary += `<div class="note-text">${noteText}</div>`;
        }

        html += `
          <td class="${cls}" data-date="${key}">
            <div class="day-num">${day}</div>
            ${summary}
          </td>
        `;

        if (weekDay === 6 && day !== daysInMonth) html += "</tr><tr>";
      }

      const lastDay = new Date(year, month, daysInMonth).getDay();
      for (let i = lastDay; i < 6; i++) html += "<td></td>";

      html += "</tr>";
      bodyEl.innerHTML = html;
    }
  </script>

  <!-- =========================================================
       (6) 點日期：先顯示備註，再開影片
       用意：
       - 有備註：先 alert 顯示（例如 Q4季會休息）
       - 1 部影片：直接開
       - 多部影片：prompt 選擇
       ========================================================= -->
  <script>
    function bindDayClick({ getByDate }) {
      const bodyEl = document.getElementById("calendarBody");

      bodyEl.addEventListener("click", (e) => {
        const cell = e.target.closest("td[data-date]");
        if (!cell) return;

        const key = cell.dataset.date;
        const list = (getByDate()[key] || []);
        if (!list.length) return;

        // ✅ 如果有備註：先顯示
        const notes = list.filter(x => x.type === "note");
        if (notes.length) {
          alert(`${key}\n\n${notes.map(n => n.text).join("\n")}`);
        }

        // ✅ 只針對影片開啟（備註不開）
        const videos = list.filter(x => x.type !== "note");
        if (!videos.length) return;

        if (videos.length === 1) {
          window.open(normalizeToWatchUrl(videos[0].url), "_blank");
          return;
        }

        const msg = videos.map((v, i) => `${i + 1}. ${v.name}`).join("\n");
        const pick = prompt(`${key} 有 ${videos.length} 部影片：\n\n${msg}\n\n輸入數字開啟（例如 1）`);
        const idx = Number(pick) - 1;

        if (!Number.isFinite(idx) || idx < 0 || idx >= videos.length) return;
        window.open(normalizeToWatchUrl(videos[idx].url), "_blank");
      });
    }
  </script>

  <!-- =========================================================
       (7) 渲染「每週訓練影片區」：只放 date 為空的影片
       用意：
       - 不排日期的影片集中放這裡
       - 你日後只要把 date 補上，它就會自動進月曆
       ========================================================= -->
  <script>
    function renderTrainingSection(db) {
      const listEl = document.getElementById("trainingList");
      const unDated = db.filter(v => !v.date);

      if (!unDated.length) {
        listEl.innerHTML = `<div class="alert alert-success">目前沒有未排日期的影片 ✅</div>`;
        return;
      }

      listEl.innerHTML = unDated.map((v, idx) => {
        const embed = normalizeToEmbedUrl(v.url);
        return `
          <div class="col-12 col-md-6 fw-bold">
            <h5 class="fw-semibold mb-3">(${escapeHtml(v.series)}) ${escapeHtml(v.name)}</h5>
            <div class="ratio ratio-16x9 shadow rounded overflow-hidden">
              <iframe src="${escapeHtml(embed)}" title="Training video ${idx + 1}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>

  <!-- =========================================================
       (8) 上/下月 & 回到今天
       用意：切換月份後重新 render 月曆
       ========================================================= -->
  <script>
    function bindNavButtons({ getState, setState, rerender }) {
      document.getElementById("prevBtn").addEventListener("click", () => {
        const s = getState();
        s.month--;
        if (s.month < 0) { s.month = 11; s.year--; }
        setState(s);
        rerender();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        const s = getState();
        s.month++;
        if (s.month > 11) { s.month = 0; s.year++; }
        setState(s);
        rerender();
      });

      document.getElementById("todayBtn").addEventListener("click", () => {
        const s = getState();
        s.year = s.realToday.getFullYear();
        s.month = s.realToday.getMonth();
        setState(s);
        rerender();
      });
    }
  </script>

  <!-- =========================================================
       (9) 初始化入口
       用意：
       - 建立骨架
       - byDate = 影片(date有) + 備註
       - 渲染月曆（顯示有 date 的影片 + 備註）
       - 渲染訓練區（顯示沒 date 的影片）
       - 綁定點擊與切月按鈕
       ========================================================= -->
  <script>
    (function init() {
      const root = document.getElementById("calendarMount");
      buildCalendarSkeleton(root);

      const db = window.VIDEO_DB || [];
      const notesObj = window.CALENDAR_NOTES || {};

      const realToday = new Date();
      let state = {
        year: realToday.getFullYear(),
        month: realToday.getMonth(),
        realToday
      };

      let byDate = {};

      function rerender() {
        // ✅ 影片（有 date）分組
        const videoByDate = groupVideosByDate(db);

        // ✅ 備註分組（例如 2026-01-12）
        const noteByDate = groupNotesByDate(notesObj);

        // ✅ 合併到同一個 byDate 結構，renderCalendar 才能一起顯示
        byDate = mergeByDate(videoByDate, noteByDate);

        renderCalendar({
          year: state.year,
          month: state.month,
          byDate,
          realToday: state.realToday
        });
      }

      // 初次渲染月曆
      rerender();

      // 初次渲染每週訓練影片（未排日期）
      renderTrainingSection(db);

      // 點日期：先顯示備註，再開影片
      bindDayClick({ getByDate: () => byDate });

      // 上下月 / 回到今天
      bindNavButtons({
        getState: () => ({ ...state }),
        setState: (s) => { state = s; },
        rerender
      });
    })();
  </script>
</body>

</html>
