<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cwli.dev 會員註冊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=20260605-3">
</head>
<body>
  <main class="auth-page">
    <div class="industrial-backdrop" aria-hidden="true">
      <div class="gallery-beam beam-left"></div>
      <div class="gallery-beam beam-right"></div>
      <div class="machine-line line-a"></div>
      <div class="machine-line line-b"></div>
      <div class="robot-arm">
        <span class="arm-base"></span>
        <span class="arm-joint joint-a"></span>
        <span class="arm-segment segment-a"></span>
        <span class="arm-joint joint-b"></span>
        <span class="arm-segment segment-b"></span>
        <span class="arm-claw"></span>
      </div>
      <div class="conveyor">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="data-panel panel-a"></div>
      <div class="data-panel panel-b"></div>
    </div>
    <section class="auth-card auth-card-personal">
      <div class="auth-brand">
        <div class="brand-badge brand-badge-personal">cw</div>
        <div>
          <div class="brand-kicker">cwli.dev</div>
          <div class="brand-signature">Business Card Console</div>
        </div>
      </div>

      <h1 class="auth-title">建立會員帳號</h1>
      <p class="auth-subtitle">註冊後即可進入名片管理工作台。</p>

      <form id="registerForm">
        <div class="name-grid mb-3">
          <div>
            <label for="lastName" class="form-label">姓氏</label>
            <input id="lastName" type="text" class="form-control" placeholder="例如：李" autocomplete="family-name">
          </div>
          <div>
            <label for="firstName" class="form-label">名字</label>
            <input id="firstName" type="text" class="form-control" placeholder="例如：政緯" autocomplete="given-name">
          </div>
        </div>

        <div class="birth-gender-grid mb-3">
          <div>
            <label for="birthDate" class="form-label">出生年月日</label>
            <input id="birthDate" type="date" class="form-control" autocomplete="bday">
          </div>
          <div>
            <label for="gender" class="form-label">性別</label>
            <select id="gender" class="form-select" autocomplete="sex">
              <option value="">選擇</option>
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">電子郵件</label>
          <input id="email" type="email" class="form-control" placeholder="請輸入電子郵件" autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">密碼</label>
          <div class="password-field">
            <input id="password" type="password" class="form-control" placeholder="請輸入密碼" autocomplete="new-password">
            <button class="password-toggle" type="button" data-target="password" aria-label="顯示密碼">顯示</button>
          </div>
          <div class="password-hint">至少 6 個字元，建議包含英文與數字。</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">確認密碼</label>
          <div class="password-field">
            <input id="confirmPassword" type="password" class="form-control" placeholder="再次輸入密碼" autocomplete="new-password">
            <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="顯示確認密碼">顯示</button>
          </div>
          <div id="confirmPasswordHint" class="password-hint">請再次輸入相同密碼。</div>
        </div>

        <button class="btn btn-primary w-100" type="submit">註冊</button>
      </form>

      <div id="msg" class="status-msg mt-3"></div>

      <hr class="my-4">

      <p class="text-center text-muted mb-0">
        已經有帳號？
        <a href="./login.html" class="fw-bold text-decoration-none">回到登入</a>
      </p>
    </section>
  </main>

  <script type="module" src="./js/register.js?v=20260605-2"></script>
</body>
</html>
