<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css?v=20260605-10">
</head>
<body>
  <div class="page-shell">
    <nav class="navbar app-navbar px-3">
      <span class="navbar-brand fw-bold">管理後台</span>
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted small d-none d-md-inline">管理員：<strong id="adminName">讀取中...</strong></span>
        <a href="./dashboard.html" class="btn btn-outline-primary btn-sm">會員頁面</a>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">登出</button>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h1 class="fw-bold mb-1">會員管理</h1>
          <p class="text-muted mb-0">最大管理員可以調整所有權限；管理員可以處理會員工具設定與狀態。</p>
        </div>
        <button id="refreshBtn" class="btn btn-primary">重新整理</button>
      </div>

      <div id="msg" class="status-msg mb-3"></div>

      <section class="admin-tools mb-3" aria-label="會員篩選工具">
        <div class="admin-stats">
          <div>
            <span>顯示</span>
            <strong id="visibleCount">0</strong>
          </div>
          <div>
            <span>全部</span>
            <strong id="totalCount">0</strong>
          </div>
          <div>
            <span>待處理</span>
            <strong id="pendingCount">0</strong>
          </div>
        </div>

        <div class="admin-filter-panel">
          <div class="admin-search">
            <label for="memberSearch">搜尋會員</label>
            <input id="memberSearch" class="form-control" type="search" placeholder="姓名、Email、職位、UID">
          </div>
          <div>
            <label for="roleFilter">權限</label>
            <select id="roleFilter" class="form-select">
              <option value="all">全部權限</option>
              <option value="super_admin">最大管理員</option>
              <option value="admin">管理員</option>
              <option value="user">一般會員</option>
            </select>
          </div>
          <div>
            <label for="statusFilter">狀態</label>
            <select id="statusFilter" class="form-select">
              <option value="all">全部狀態</option>
              <option value="active">啟用</option>
              <option value="disabled">停用</option>
            </select>
          </div>
          <div>
            <label for="genderFilter">性別</label>
            <select id="genderFilter" class="form-select">
              <option value="all">全部性別</option>
              <option value="male">男</option>
              <option value="female">女</option>
              <option value="unknown">未設定</option>
            </select>
          </div>
          <div>
            <label for="requestFilter">申請</label>
            <select id="requestFilter" class="form-select">
              <option value="all">全部申請</option>
              <option value="pending">只看待處理</option>
            </select>
          </div>
        </div>
      </section>

      <section id="usersList" class="member-list" aria-live="polite">
        <div class="empty-state">讀取中...</div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/admin.js?v=20260605-4"></script>
</body>
</html>
