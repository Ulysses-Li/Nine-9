<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cwli.dev 會員登入</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=20260604-8">
</head>
<body>
  <main class="auth-page">
    <div class="industrial-backdrop" aria-hidden="true">
      <div class="gallery-beam beam-left"></div>
      <div class="gallery-beam beam-right"></div>
      <div class="machine-line line-a"></div>
      <div class="machine-line line-b"></div>
      <div class="robot-arm">
        <span class="arm-base"></span>
        <span class="arm-joint joint-a"></span>
        <span class="arm-segment segment-a"></span>
        <span class="arm-joint joint-b"></span>
        <span class="arm-segment segment-b"></span>
        <span class="arm-claw"></span>
      </div>
      <div class="conveyor">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="data-panel panel-a"></div>
      <div class="data-panel panel-b"></div>
    </div>
    <section class="auth-card auth-card-personal">
      <div class="auth-brand">
        <div class="brand-badge brand-badge-personal">cw</div>
        <div>
          <div class="brand-kicker">cwli.dev</div>
          <div class="brand-signature">Business Card Console</div>
        </div>
      </div>

      <h1 class="auth-title">會員登入</h1>
      <p class="auth-subtitle">進入名片資料與批次辨識工作台。</p>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">電子郵件</label>
          <input id="email" type="email" class="form-control" placeholder="請輸入電子郵件" autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">密碼</label>
          <div class="password-field">
            <input id="password" type="password" class="form-control" placeholder="請輸入密碼" autocomplete="current-password">
            <button id="togglePassword" class="password-toggle" type="button" aria-label="顯示密碼">顯示</button>
          </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">登入</button>
      </form>

      <div id="msg" class="status-msg mt-3"></div>

      <hr class="my-4">

      <p class="text-center text-muted mb-0">
        還沒有帳號？
        <a href="./register.html" class="fw-bold text-decoration-none">前往註冊</a>
      </p>
    </section>
  </main>

  <script type="module" src="./js/login.js?v=20260604-4"></script>
</body>
</html>
