<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jimmore 發票 QR 上傳工具</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f6f8fb;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }

    .wrap {
      max-width: 980px;
      margin: 28px auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
      padding: 28px;
    }

    .preview-box {
      min-height: 340px;
      border: 2px dashed #ced4da;
      border-radius: 16px;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .preview-box img,
    .preview-box video,
    .preview-box canvas {
      max-width: 100%;
      max-height: 560px;
      object-fit: contain;
      border-radius: 12px;
    }

    #captureCanvas {
      display: none;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .field-card {
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      height: 100%;
    }

    .hint {
      color: #6c757d;
      font-size: 14px;
    }

    .crop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .crop-item {
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
    }

    .crop-item canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #f8f9fa;
      display: block;
      margin-top: 8px;
    }

    .badge-soft {
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container py-3">
    <div class="wrap">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <h2 class="mb-1">Jimmore 發票 QR 上傳工具</h2>
          <div class="hint">先抓 QR 原始內容，再自動嘗試解析台灣電子發票左側主資料。</div>
        </div>
        <span class="badge-soft">左 QR Code 優先</span>
      </div>

      <div class="alert alert-secondary py-2 mb-3">
        解析順序：<b>左半邊 → 左下區域 → 整張圖片</b>。<br>
        若掃到的是左邊電子發票 QR，會自動拆出：發票號碼、日期、隨機碼、總金額、銷售額、稅額、買方統編、賣方統編。
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label class="form-label fw-bold">GAS Web App URL</label>
          <input type="text" id="gasUrl" class="form-control"
            placeholder="貼上 GAS Web App URL，例如 https://script.google.com/macros/s/.../exec">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">工作表名稱</label>
          <input type="text" id="sheetName" class="form-control" value="發票資訊">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">拍照上傳</label>
          <input type="file" id="cameraInput" class="form-control" accept="image/*" capture="environment">
          <div class="hint mt-1">手機可直接開啟後鏡頭。</div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">從裝置選擇圖片</label>
          <input type="file" id="fileInput" class="form-control" accept="image/*">
          <div class="hint mt-1">建議左邊 QR Code 盡量清楚、放大、不要太斜。</div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <button class="btn btn-outline-primary w-100" id="startCameraBtn">開啟相機即時掃描</button>
        </div>
        <div class="col-md-6">
          <button class="btn btn-outline-secondary w-100" id="stopCameraBtn" disabled>停止相機</button>
        </div>
      </div>

      <div class="preview-box mb-3" id="previewBox">
        <span class="text-muted">尚未選擇圖片 / 尚未開啟相機</span>
      </div>

      <video id="video" playsinline muted style="display:none;"></video>
      <canvas id="captureCanvas"></canvas>

      <div class="d-flex gap-2 flex-wrap mb-3">
        <button class="btn btn-primary" id="decodeBtn">解析左邊 QR Code</button>
        <button class="btn btn-success" id="saveBtn" disabled>寫入 Google Sheet</button>
        <button class="btn btn-outline-danger" id="clearBtn">清除</button>
      </div>

      <div id="status"></div>

      <div class="card mt-3" id="rawCard" style="display:none;">
        <div class="card-body">
          <h5 class="card-title">QR 原始內容</h5>
          <div class="mono" id="rawText"></div>
        </div>
      </div>

      <div class="card mt-3" id="resultCard" style="display:none;">
        <div class="card-body">
          <h5 class="card-title">解析結果</h5>
          <div class="row g-3" id="resultFields"></div>
        </div>
      </div>

      <div class="card mt-3" id="debugCard" style="display:none;">
        <div class="card-body">
          <h5 class="card-title">掃描區域預覽</h5>
          <div class="crop-grid" id="cropGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import QrScanner from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';

    const gasUrlEl = document.getElementById('gasUrl');
    const sheetNameEl = document.getElementById('sheetName');
    const cameraInput = document.getElementById('cameraInput');
    const fileInput = document.getElementById('fileInput');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const decodeBtn = document.getElementById('decodeBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const previewBox = document.getElementById('previewBox');
    const video = document.getElementById('video');
    const captureCanvas = document.getElementById('captureCanvas');
    const statusEl = document.getElementById('status');
    const rawCard = document.getElementById('rawCard');
    const rawText = document.getElementById('rawText');
    const resultCard = document.getElementById('resultCard');
    const resultFields = document.getElementById('resultFields');
    const debugCard = document.getElementById('debugCard');
    const cropGrid = document.getElementById('cropGrid');

    let currentFile = null;
    let parsedInvoice = null;
    let qrScanner = null;
    let lastScannedText = '';

    gasUrlEl.value = localStorage.getItem('JIMMORE_QR_GAS_URL') || '';
    sheetNameEl.value = localStorage.getItem('JIMMORE_QR_SHEET_NAME') || '發票資訊';

    gasUrlEl.addEventListener('change', () => {
      localStorage.setItem('JIMMORE_QR_GAS_URL', gasUrlEl.value.trim());
    });

    sheetNameEl.addEventListener('change', () => {
      localStorage.setItem('JIMMORE_QR_SHEET_NAME', sheetNameEl.value.trim());
    });

    cameraInput.addEventListener('change', handleFileSelect);
    fileInput.addEventListener('change', handleFileSelect);
    startCameraBtn.addEventListener('click', startCamera);
    stopCameraBtn.addEventListener('click', stopCamera);
    decodeBtn.addEventListener('click', decodeCurrentSource);
    saveBtn.addEventListener('click', saveToSheet);
    clearBtn.addEventListener('click', clearAll);

    async function handleFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      stopCamera();
      currentFile = file;
      parsedInvoice = null;
      saveBtn.disabled = true;
      rawCard.style.display = 'none';
      resultCard.style.display = 'none';
      debugCard.style.display = 'none';
      cropGrid.innerHTML = '';
      lastScannedText = '';

      const url = URL.createObjectURL(file);
      previewBox.innerHTML = `<img src="${url}" alt="發票預覽">`;
      showStatus('已載入圖片，請按「解析左邊 QR Code」。', 'info');
    }

    async function startCamera() {
      try {
        stopCamera();
        currentFile = null;
        parsedInvoice = null;
        saveBtn.disabled = true;
        rawCard.style.display = 'none';
        resultCard.style.display = 'none';
        debugCard.style.display = 'none';
        cropGrid.innerHTML = '';
        lastScannedText = '';

        video.style.display = 'block';
        previewBox.innerHTML = '';
        previewBox.appendChild(video);

        qrScanner = new QrScanner(
          video,
          result => {
            if (!result?.data) return;
            if (result.data === lastScannedText) return;
            lastScannedText = result.data;
            tryParseAndRender(result.data, true);
          },
          {
            preferredCamera: 'environment',
            highlightScanRegion: true,
            highlightCodeOutline: true,
            returnDetailedScanResult: true,
          }
        );

        await qrScanner.start();
        startCameraBtn.disabled = true;
        stopCameraBtn.disabled = false;
        showStatus('相機已開啟，請把左邊 QR Code 對準畫面。', 'info');
      } catch (err) {
        console.error(err);
        showStatus('相機啟動失敗：' + err.message, 'danger');
      }
    }

    function stopCamera() {
      if (qrScanner) {
        qrScanner.stop();
        qrScanner.destroy();
        qrScanner = null;
      }
      video.style.display = 'none';
      startCameraBtn.disabled = false;
      stopCameraBtn.disabled = true;
    }

    async function decodeCurrentSource() {
      try {
        parsedInvoice = null;
        saveBtn.disabled = true;
        rawCard.style.display = 'none';
        resultCard.style.display = 'none';
        debugCard.style.display = 'none';
        cropGrid.innerHTML = '';

        if (currentFile) {
          showStatus('正在用多區域模式解析左側 QR Code...', 'info');

          const img = await loadImageFromFile(currentFile);

          const regions = buildScanRegions(img);
          renderCropPreview(regions);

          let foundAnyQr = false;
          let lastQrText = '';

          for (const item of regions) {
            const tries = [
              item.canvas,
              upscaleCanvas(item.canvas, 2)
            ];

            for (const canvas of tries) {
              try {
                const result = await QrScanner.scanImage(canvas, {
                  returnDetailedScanResult: true
                });

                if (result?.data) {
                  foundAnyQr = true;
                  lastQrText = result.data;

                  const ok = tryParseAndRender(result.data, false, item.label);
                  if (ok) return;
                }
              } catch (err) {
                // 繼續下一張候選區域
              }
            }
          }

          if (foundAnyQr) {
            rawText.textContent = lastQrText;
            rawCard.style.display = 'block';
            showStatus('有掃到 QR Code，但這次不是左邊電子發票主資料。建議讓左 QR 再更大一些。', 'warning');
            return;
          }

          throw new Error('找不到 QR Code');
        }

        if (qrScanner) {
          showStatus('相機模式中，請把左邊 QR Code 靠近鏡頭。', 'info');
          return;
        }

        showStatus('請先拍照、上傳圖片，或開啟相機。', 'danger');
      } catch (err) {
        console.error(err);
        showStatus('找不到可解析的左側 QR Code。建議只拍發票中下段，讓兩顆 QR 更大。', 'danger');
      }
    }

    function upscaleCanvas(sourceCanvas, scale = 2) {
      const canvas = document.createElement('canvas');
      canvas.width = sourceCanvas.width * scale;
      canvas.height = sourceCanvas.height * scale;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        sourceCanvas,
        0, 0, sourceCanvas.width, sourceCanvas.height,
        0, 0, canvas.width, canvas.height
      );

      return canvas;
    }

    function buildScanRegions(img) {
      const w = img.width;
      const h = img.height;

      return [
        {
          label: '整張圖片',
          canvas: cropImageCanvas(img, 0, 0, w, h)
        },
        {
          label: '中間偏下大區',
          canvas: cropImageCanvas(img, w * 0.18, h * 0.18, w * 0.64, h * 0.62)
        },
        {
          label: '中間偏左',
          canvas: cropImageCanvas(img, w * 0.12, h * 0.22, w * 0.46, h * 0.56)
        },
        {
          label: '中間偏右',
          canvas: cropImageCanvas(img, w * 0.32, h * 0.20, w * 0.42, h * 0.58)
        },
        {
          label: 'QR 常見中下區',
          canvas: cropImageCanvas(img, w * 0.20, h * 0.32, w * 0.55, h * 0.36)
        },
        {
          label: '左 QR 常見區',
          canvas: cropImageCanvas(img, w * 0.22, h * 0.34, w * 0.28, h * 0.28)
        },
        {
          label: '兩顆 QR 區',
          canvas: cropImageCanvas(img, w * 0.20, h * 0.30, w * 0.62, h * 0.30)
        }
      ];
    }

    function tryParseAndRender(qrText, fromCamera = false, sourceLabel = '') {
      rawText.textContent = qrText;
      rawCard.style.display = 'block';

      console.log('QR RAW:', qrText);

      try {
        const parsed = parseTaiwanInvoiceLeftQr(qrText);
        parsedInvoice = parsed;
        renderResult(parsed);
        saveBtn.disabled = false;

        let msg = fromCamera ? '相機掃描成功，已解析左邊 QR Code。' : '圖片解析成功。';
        if (sourceLabel) msg += `（來源：${sourceLabel}）`;
        showStatus(msg, 'success');
        return true;
      } catch (err) {
        console.warn('不是左邊發票 QR：', err.message);
        parsedInvoice = null;
        saveBtn.disabled = true;

        let msg = '有掃到 QR Code，已顯示原始內容，但它不是可辨識的台灣電子發票左側主資料。';
        if (sourceLabel) msg += `（來源：${sourceLabel}）`;
        showStatus(msg, 'warning');
        return false;
      }
    }

    function parseTaiwanInvoiceLeftQr(input) {
      const text = String(input || '').replace(/[\r\n]/g, '').trim();

      if (!text || text.length < 53) {
        throw new Error('QR 內容長度不足');
      }

      const invoiceNoRaw = text.slice(0, 10);
      const dateRaw = text.slice(10, 17);
      const randomCode = text.slice(17, 21);
      const salesHex = text.slice(21, 29);
      const totalHex = text.slice(29, 37);
      const buyerTaxIdRaw = text.slice(37, 45);
      const sellerTaxIdRaw = text.slice(45, 53);

      if (!/^[A-Z]{2}\d{8}$/i.test(invoiceNoRaw)) {
        throw new Error('不是標準發票號碼格式');
      }
      if (!/^\d{7}$/.test(dateRaw)) {
        throw new Error('不是標準發票日期格式');
      }
      if (!/^\d{4}$/.test(randomCode)) {
        throw new Error('不是標準隨機碼格式');
      }
      if (!/^[0-9A-Fa-f]{8}$/.test(salesHex) || !/^[0-9A-Fa-f]{8}$/.test(totalHex)) {
        throw new Error('金額欄位不是 16 進位');
      }
      if (!/^\d{8}$/.test(buyerTaxIdRaw) || !/^\d{8}$/.test(sellerTaxIdRaw)) {
        throw new Error('統編欄位不是 8 碼');
      }

      const invoiceNo = `${invoiceNoRaw.slice(0, 2)}-${invoiceNoRaw.slice(2)}`;
      const date = formatRocDate(dateRaw);

      let salesAmount = parseInt(salesHex, 16);
      let totalAmount = parseInt(totalHex, 16);
      let taxAmount = totalAmount - salesAmount;

      const buyerTaxId = buyerTaxIdRaw === '00000000' ? '' : buyerTaxIdRaw;
      const sellerTaxId = sellerTaxIdRaw === '00000000' ? '' : sellerTaxIdRaw;

      // ===== 金額合理性檢查 =====
      let amountStatus = 'ok';

      if (salesAmount < 0 || totalAmount < 0) {
        amountStatus = 'invalid';
      }

      if (salesAmount > totalAmount) {
        amountStatus = 'invalid';
      }

      // 這種情況很像你現在遇到的：銷售額被掃成 0，導致稅額 = 總額
      if (salesAmount === 0 && totalAmount > 0) {
        amountStatus = 'suspicious';
        taxAmount = '';
        salesAmount = '';
      }

      return {
        invoiceNo,
        date,
        randomCode,
        totalAmount,
        salesAmount,
        taxAmount,
        buyerTaxId,
        sellerTaxId,
        salesHex,
        totalHex,
        amountStatus
      };
    }

    function formatRocDate(roc) {
      const year = Number(roc.slice(0, 3)) + 1911;
      const month = roc.slice(3, 5);
      const day = roc.slice(5, 7);
      return `${year}-${month}-${day}`;
    }

    function renderResult(data) {
      const amountNote =
        data.amountStatus === 'suspicious'
          ? '金額欄位疑似掃描不完整，已保留總金額，但未強制推算銷售額/稅額'
          : data.amountStatus === 'invalid'
            ? '金額欄位格式異常'
            : '正常';

      const fields = [
        ['發票號碼', data.invoiceNo],
        ['日期', data.date],
        ['隨機碼', data.randomCode],
        ['總金額', data.totalAmount],
        ['銷售額', data.salesAmount ?? ''],
        ['稅額', data.taxAmount ?? ''],
        ['買方統編', data.buyerTaxId || ''],
        ['賣方統編', data.sellerTaxId || ''],
        ['銷售額 HEX', data.salesHex || ''],
        ['總金額 HEX', data.totalHex || ''],
        ['金額判定', amountNote]
      ];

      resultFields.innerHTML = '';
      for (const [label, value] of fields) {
        const div = document.createElement('div');
        div.className = 'col-md-6';
        div.innerHTML = `
      <div class="field-card">
        <div class="text-muted small">${escapeHtml(label)}</div>
        <div class="fw-bold">${escapeHtml(String(value ?? ''))}</div>
      </div>
    `;
        resultFields.appendChild(div);
      }
      resultCard.style.display = 'block';
    }

    function renderCropPreview(candidates) {
      cropGrid.innerHTML = '';

      candidates.slice(0, 6).forEach(item => {
        const box = document.createElement('div');
        box.className = 'crop-item';
        box.innerHTML = `<div class="fw-bold small">${escapeHtml(item.label)}</div>`;
        box.appendChild(item.canvas);
        cropGrid.appendChild(box);
      });

      debugCard.style.display = 'block';
    }

    async function saveToSheet() {
      try {
        if (!parsedInvoice) {
          showStatus('目前沒有可寫入的解析結果。', 'danger');
          return;
        }

        const gasUrl = gasUrlEl.value.trim();
        const sheetName = sheetNameEl.value.trim() || '發票資訊';

        if (!gasUrl) {
          showStatus('請先輸入 GAS Web App URL。', 'danger');
          return;
        }

        showStatus('正在寫入 Google Sheet...', 'info');

        const res = await fetch(gasUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'appendInvoice',
            sheetName,
            data: parsedInvoice
          }),
        });

        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (err) {
          throw new Error('GAS 回傳不是 JSON：' + text);
        }

        if (!json.success) {
          throw new Error(json.message || '寫入失敗');
        }

        showStatus(`已成功寫入 Google Sheet，第 ${json.rowNumber} 列。`, 'success');
      } catch (err) {
        console.error(err);
        showStatus('寫入失敗：' + err.message, 'danger');
      }
    }

    function clearAll() {
      stopCamera();
      currentFile = null;
      parsedInvoice = null;
      lastScannedText = '';
      cameraInput.value = '';
      fileInput.value = '';
      rawCard.style.display = 'none';
      resultCard.style.display = 'none';
      debugCard.style.display = 'none';
      cropGrid.innerHTML = '';
      saveBtn.disabled = true;
      statusEl.innerHTML = '';
      previewBox.innerHTML = '<span class="text-muted">尚未選擇圖片 / 尚未開啟相機</span>';
    }

    function showStatus(msg, type = 'info') {
      statusEl.innerHTML = `<div class="alert alert-${type} mt-2 mb-0">${escapeHtml(msg)}</div>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function cropImageCanvas(img, sx, sy, sw, sh) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.floor(sw));
      canvas.height = Math.max(1, Math.floor(sh));

      const ctx = canvas.getContext('2d');
      ctx.drawImage(
        img,
        sx, sy, sw, sh,
        0, 0, canvas.width, canvas.height
      );

      return canvas;
    }
  </script>
</body>

</html>
