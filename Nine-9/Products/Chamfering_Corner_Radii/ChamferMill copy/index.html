<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chamfer Mill Tech Center</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- 共用 Header / Footer -->
  <link rel="stylesheet" href="../../../../header/header.css">
  <link rel="stylesheet" href="../../../../footer/footer.css">

  <style>
    /* =========================================================
       Basic
    ========================================================= */

    body {
      margin: 0;
      background: #f4f4f4;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #111;
    }

    .resource-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 90px;
    }

    .resource-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 48px;
    }

    /* =========================================================
       Side Menu
    ========================================================= */

    .side-menu {
      background: #cfcfcf;
      padding: 18px;
      align-self: start;
    }

    .side-menu a {
      display: block;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 0;
      border-bottom: 2px solid #333;
      cursor: pointer;
    }

    .side-menu a:hover,
    .side-menu a.active {
      color: #f05a1a;
    }

    /* =========================================================
       Common Title
    ========================================================= */

    .page-title {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .title-line {
      height: 2px;
      background: #222;
      margin-bottom: 28px;
    }

    /* =========================================================
       Download Page
    ========================================================= */

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 48px;
      max-width: 720px;
    }

    .resource-card {
      color: #111;
      text-decoration: none;
      transition: 0.25s;
    }

    .resource-card:hover {
      transform: translateY(-4px);
    }

    .resource-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .resource-title::before {
      content: "•";
      margin-right: 14px;
    }

    .resource-preview {
      width: 190px;
      height: 270px;
      border: 1px solid #333;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .resource-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================================
       Programming Page
    ========================================================= */

    .program-box {
      border: 2px solid #333;
      background: #fff;
      padding: 36px;
      max-width: 720px;
    }

    .program-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .program-desc {
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .program-btn {
      display: inline-block;
      padding: 14px 26px;
      border: 2px solid #333;
      color: #111;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }

    .program-btn:hover {
      color: #f05a1a;
      border-color: #f05a1a;
    }

    /* =========================================================
       FAQ List
    ========================================================= */

    .faq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 760px;
    }

    .faq-card {
      display: block;
      border: 2px solid #333;
      background: #fff;
      color: #111;
      text-decoration: none;
      cursor: pointer;
      transition: 0.25s;
    }

    .faq-card:hover {
      transform: translateY(-4px);
      border-color: #f05a1a;
    }

    .faq-img {
      height: 130px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      background: #fff;
    }

    .faq-text {
      padding: 24px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
    }

    /* =========================================================
       FAQ Detail
    ========================================================= */

    .faq-detail {
      max-width: 780px;
      border: 2px solid #333;
      background: #fff;
    }

    .faq-detail-title {
      font-size: 28px;
      font-weight: 800;
      padding: 16px 28px;
      border-bottom: 2px solid #333;
    }

    .faq-detail-body {
      padding: 28px 40px 32px;
    }

    .faq-video {
      height: 220px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .faq-desc-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .faq-desc {
      font-size: 20px;
      line-height: 1.8;
      margin-bottom: 26px;
    }

    .contact-box {
      border: 2px solid #333;
      padding: 14px 18px;
      font-size: 24px;
      font-weight: 800;
      max-width: 520px;
      margin-bottom: 16px;
    }

    .contact-box span {
      display: block;
      font-size: 28px;
    }

    .faq-nav {
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      margin-top: 22px;
      font-size: 28px;
      font-weight: 800;
    }

    .faq-nav button {
      border: none;
      background: transparent;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
    }

    .faq-nav button:hover {
      color: #f05a1a;
    }

    /* =========================================================
       Mobile
    ========================================================= */

    @media (max-width: 768px) {
      .resource-layout {
        grid-template-columns: 1fr;
      }

      .resource-grid,
      .faq-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 28px;
      }

      .faq-text {
        font-size: 24px;
      }

      .faq-detail-body {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <main class="resource-page">
    <div class="resource-layout">

      <!-- 左側選單 -->
      <aside class="side-menu">
        <a data-page="download" class="active">Catalog & Cutting Data Download</a>
        <a data-page="programming">NC 程式產生器</a>
        <a data-page="faq">常見技術問題</a>
      </aside>

      <!-- 右側內容由 JS 產生 -->
      <section class="resource-content" id="contentArea"></section>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    /* =========================================================
       Data
    ========================================================= */

    const FAQ_ITEMS = [
      {
        title: "問題一",
        subtitle: "文字敘述",
        detailTitle: "問題一的技術問題",
        desc: "這裡放問題一的詳細說明，例如加工時可能遇到的原因、判斷方式與建議改善方向。",
      },
      {
        title: "問題二",
        subtitle: "文字敘述",
        detailTitle: "問題二的技術問題",
        desc: "這裡放問題二的詳細說明，例如刀具壽命、加工條件、切削聲音、負載變化等技術內容。",
      },
      {
        title: "問題三",
        subtitle: "文字敘述",
        detailTitle: "問題三的技術問題",
        desc: "這裡放問題三的詳細說明，例如毛邊、倒角品質、表面粗糙度或切削參數修正建議。",
      }
    ];

    const contentArea = document.getElementById("contentArea");
    const menuLinks = document.querySelectorAll(".side-menu a");

    /* =========================================================
       Render Download
    ========================================================= */

    function renderDownload() {
      contentArea.innerHTML = `
        <h1 class="page-title">Chamfer Mill Download</h1>
        <div class="title-line"></div>

        <div class="resource-grid">
          <a class="resource-card" href="./catalog/chamfer-mill-catalog.pdf" target="_blank">
            <div class="resource-title">Catalog</div>
            <div class="resource-preview">
              <img src="./img/chamfer-mill-catalog-cover.jpg" alt="Chamfer Mill Catalog">
            </div>
          </a>

          <a class="resource-card" href="./cutting-data/chamfer-mill-cutting-data.pdf" target="_blank">
            <div class="resource-title">Cutting Data</div>
            <div class="resource-preview">
              <img src="./img/chamfer-mill-cutting-data-cover.jpg" alt="Chamfer Mill Cutting Data">
            </div>
          </a>
        </div>
      `;
    }

    /* =========================================================
       Render Programming
    ========================================================= */

    function renderProgramming() {
      contentArea.innerHTML = `
        <h1 class="page-title">Chamfer Mill NC 程式產生器</h1>
        <div class="title-line"></div>

        <div class="program-box">
          <div class="program-title">NC Program Generator</div>

          <div class="program-desc">
            此區可放 Chamfer Mill 專用 NC 程式產生器、加工條件計算器，
            或連結到外部 G-code 工具頁面。
          </div>

          <a href="./nc-program/index.html" class="program-btn">
            Open NC Program Generator
          </a>
        </div>
      `;
    }

    /* =========================================================
       Render FAQ List
    ========================================================= */

    function renderFaqList() {
      contentArea.innerHTML = `
        <h1 class="page-title">Chamfer Mill 常見技術問題</h1>
        <div class="title-line"></div>

        <div class="faq-grid">
          ${FAQ_ITEMS.map((item, index) => `
            <div class="faq-card" onclick="renderFaqDetail(${index})">
              <div class="faq-img">圖</div>
              <div class="faq-text">
                ${item.title}<br>
                ${item.subtitle}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    /* =========================================================
       Render FAQ Detail
    ========================================================= */

    function renderFaqDetail(index) {
      const item = FAQ_ITEMS[index];

      const prevIndex = index - 1;
      const nextIndex = index + 1;

      contentArea.innerHTML = `
        <div class="faq-detail">
          <div class="faq-detail-title">${item.detailTitle}</div>

          <div class="faq-detail-body">
            <div class="faq-video">
              ${item.title}<br>圖片或影片
            </div>

            <div class="faq-desc-title">文字敘述</div>

            <div class="faq-desc">
              ${item.desc}
            </div>

            <div class="contact-box">
              聯絡我們
              <span>Contact with Nine9 Tech Support</span>
            </div>

            <div class="faq-desc">
              詢問此主題與客戶可留言的表單
            </div>
          </div>
        </div>

        <div class="faq-nav">
          <button onclick="renderFaqDetail(${prevIndex})" ${prevIndex < 0 ? "disabled" : ""}>
            ◀ ${prevIndex >= 0 ? FAQ_ITEMS[prevIndex].title : ""}
          </button>

          <button onclick="renderFaqDetail(${nextIndex})" ${nextIndex >= FAQ_ITEMS.length ? "disabled" : ""}>
            ${nextIndex < FAQ_ITEMS.length ? FAQ_ITEMS[nextIndex].title : ""} ▶
          </button>
        </div>
      `;
    }

    /* =========================================================
       Menu Click
    ========================================================= */

    menuLinks.forEach(link => {
      link.addEventListener("click", function () {
        menuLinks.forEach(item => item.classList.remove("active"));
        this.classList.add("active");

        const page = this.dataset.page;

        if (page === "download") renderDownload();
        if (page === "programming") renderProgramming();
        if (page === "faq") renderFaqList();
      });
    });

    /* 預設顯示 Download */
    renderDownload();
  </script>

  <script>
    fetch('../../../../header/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const topNav = document.getElementById('topNav');

        if (mobileMenuBtn && topNav) {
          mobileMenuBtn.addEventListener('click', function () {
            topNav.classList.toggle('active');
          });
        }
      });

    fetch('../../../../footer/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>

</body>
</html>
