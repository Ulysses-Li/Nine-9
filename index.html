<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Training Videos</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./my.css">
</head>
<body>

    <div class="container my-5">

        <h2 class="mb-4 fw-bold">📺 每週訓練影片</h2>

        <!-- ===== 影片 1 ===== -->
        <div class="mb-5">
            <h5 class="fw-semibold mb-3">① 教學影片一</h5>
            <div class="ratio ratio-16x9 shadow rounded overflow-hidden">
                <iframe
                    src="https://www.youtube.com/embed/CTO734Y5eEU"
                    title="YouTube video 1"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <p class="mt-2 text-muted">請完整觀看影片後，再進行後續操作。</p>
        </div>

        <!-- ===== 影片 2 ===== -->
        <div class="mb-5">
            <h5 class="fw-semibold mb-3">② 教學影片二</h5>
            <div class="ratio ratio-16x9 shadow rounded overflow-hidden">
                <iframe
                    src="https://www.youtube.com/embed/HREEbCnDXWM?start=2"
                    title="YouTube video 2"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <p class="mt-2 text-muted">本影片從第 2 秒開始播放。</p>
        </div>

        <!-- ===== 影片 3 ===== -->
        <div class="mb-5">
            <h5 class="fw-semibold mb-3">③ 教學影片三</h5>
            <div class="ratio ratio-16x9 shadow rounded overflow-hidden">
                <iframe
                    src="https://www.youtube.com/embed/Oag-AwSQDgY"
                    title="YouTube video 3"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <p class="mt-2 text-muted">請觀看完整影片。</p>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
