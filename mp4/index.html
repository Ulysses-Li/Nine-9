<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperFrames Concept Demo｜HTML 做影片感動畫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .video-stage {
      width: min(100%, 1080px);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 20% 20%, rgba(240, 90, 26, .45), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, .35), transparent 28%),
        linear-gradient(135deg, #111827, #020617);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridMove 8s linear infinite;
    }

    .brand {
      position: absolute;
      top: 42px;
      left: 52px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #f97316;
      opacity: 0;
      animation: fadeIn .8s ease forwards .3s;
    }

    .title {
      position: absolute;
      left: 52px;
      top: 150px;
      font-size: clamp(34px, 6vw, 76px);
      line-height: 1.05;
      font-weight: 900;
      max-width: 620px;
      opacity: 0;
      transform: translateY(40px);
      animation: slideUp 1s cubic-bezier(.2,.9,.2,1) forwards .8s;
    }

    .subtitle {
      position: absolute;
      left: 56px;
      top: 340px;
      font-size: clamp(16px, 2vw, 24px);
      color: #cbd5e1;
      opacity: 0;
      transform: translateY(24px);
      animation: slideUp 1s cubic-bezier(.2,.9,.2,1) forwards 1.6s;
    }

    .tool {
      position: absolute;
      right: 110px;
      top: 125px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, #f97316, #facc15, #f97316, #7c2d12, #f97316);
      box-shadow: 0 0 40px rgba(249,115,22,.5);
      animation: spin 2.8s linear infinite, toolIn 1.1s ease forwards .9s;
      opacity: 0;
    }

    .tool::before {
      content: "";
      position: absolute;
      inset: 42px;
      border-radius: 50%;
      background: #0f172a;
      border: 4px solid rgba(255,255,255,.2);
    }

    .tool::after {
      content: "CUTTER";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .path {
      position: absolute;
      right: 64px;
      bottom: 92px;
      width: 320px;
      height: 160px;
      border: 3px dashed rgba(255,255,255,.35);
      border-radius: 50%;
      opacity: 0;
      animation: fadeIn .8s ease forwards 2.1s;
    }

    .dot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #38bdf8;
      border-radius: 50%;
      right: 210px;
      bottom: 165px;
      box-shadow: 0 0 24px #38bdf8;
      opacity: 0;
      animation: orbit 3s linear infinite 2.3s, fadeIn .4s ease forwards 2.3s;
    }

    .cards {
      position: absolute;
      left: 52px;
      bottom: 52px;
      display: flex;
      gap: 16px;
    }

    .card {
      width: 150px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.16);
      opacity: 0;
      transform: translateY(26px) scale(.96);
    }

    .card:nth-child(1) { animation: popIn .7s ease forwards 2.5s; }
    .card:nth-child(2) { animation: popIn .7s ease forwards 2.8s; }
    .card:nth-child(3) { animation: popIn .7s ease forwards 3.1s; }

    .card .num {
      font-size: 26px;
      font-weight: 900;
      color: #f97316;
      margin-bottom: 6px;
    }

    .card .text {
      font-size: 14px;
      color: #e5e7eb;
    }

    .caption {
      position: absolute;
      right: 52px;
      bottom: 42px;
      color: #94a3b8;
      font-size: 14px;
      opacity: 0;
      animation: fadeIn .8s ease forwards 4s;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 48px 48px; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toolIn {
      from {
        opacity: 0;
        transform: translateX(80px) scale(.8);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes spin {
      to { rotate: 360deg; }
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(160px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(160px) rotate(-360deg); }
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .video-stage {
        border-radius: 20px;
      }

      .brand {
        top: 24px;
        left: 24px;
      }

      .title {
        left: 24px;
        top: 80px;
        max-width: 80%;
      }

      .subtitle {
        left: 26px;
        top: 210px;
      }

      .tool {
        width: 110px;
        height: 110px;
        right: 35px;
        top: 250px;
      }

      .path,
      .dot,
      .caption {
        display: none;
      }

      .cards {
        left: 24px;
        right: 24px;
        bottom: 24px;
        gap: 10px;
      }

      .card {
        flex: 1;
        width: auto;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!--
    這就是 HyperFrames 的概念：
    不是把影片放進 HTML，
    而是把 HTML / CSS 動畫當成影片畫面。

    真正的 HyperFrames 會再把這個畫面逐幀 Render 成 MP4。
  -->

  <section class="video-stage">
    <div class="grid"></div>

    <div class="brand">NINE9 TECH VIDEO</div>

    <h1 class="title">
      Thread Milling<br>
      Program Generator
    </h1>

    <p class="subtitle">
      HTML + CSS Animation → Render → MP4
    </p>

    <div class="tool"></div>
    <div class="path"></div>
    <div class="dot"></div>

    <div class="cards">
      <div class="card">
        <div class="num">01</div>
        <div class="text">Product Data</div>
      </div>

      <div class="card">
        <div class="num">02</div>
        <div class="text">Motion Design</div>
      </div>

      <div class="card">
        <div class="num">03</div>
        <div class="text">Export Video</div>
      </div>
    </div>

    <div class="caption">類 HyperFrames 概念展示</div>
  </section>

</body>
</html>
