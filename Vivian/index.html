<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庫存查詢</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb;font-family:"Microsoft JhengHei";}
.container{max-width:1200px;}
.card{border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.05);}
table{font-size:14px;}
th{background:#f1f5f9;position:sticky;top:0;}
</style>
</head>
<body>

<div class="container py-4">

<h3 class="mb-3">庫存查詢</h3>

<div class="card p-3 mb-3">
  <div class="row g-2">

    <div class="col-md-3">
      <label class="form-label">關鍵字</label>
      <input id="keyword" class="form-control" placeholder="產品編號 / 品名">
    </div>

    <div class="col-md-3">
      <label class="form-label">類別</label>
      <select id="categoryFilter" class="form-select">
        <option value="">全部</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">庫存條件</label>
      <select id="stockFilter" class="form-select">
        <option value="all">全部</option>
        <option value="in">有庫存</option>
        <option value="zero">零庫存</option>
        <option value="low">低庫存（<=10）</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">排序</label>
      <select id="sortBy" class="form-select">
        <option value="codeAsc">產品編號 A→Z</option>
        <option value="codeDesc">產品編號 Z→A</option>
        <option value="qtyDesc">數量 高→低</option>
        <option value="qtyAsc">數量 低→高</option>
      </select>
    </div>

  </div>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>產品編號</th>
          <th>數量</th>
          <th>品名規格</th>
          <th>類別</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="text-center">載入中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxf0IyLpZl8RtIJ2Hct4mNaQAjpUshUHnelflhQW_sz7PveY7T4eG7HIIXwvZxVZMOG/exec';

const state = { rows: [], filtered: [] };

const els = {
  keyword: document.getElementById('keyword'),
  categoryFilter: document.getElementById('categoryFilter'),
  stockFilter: document.getElementById('stockFilter'),
  sortBy: document.getElementById('sortBy'),
  tableBody: document.getElementById('tableBody')
};

function parseNum(v){return Number(v)||0}

function load(){
  fetch(GAS_URL)
  .then(r=>r.json())
  .then(res=>{
    state.rows = res.rows || [];
    fillCategory();
    apply();
  });
}

function fillCategory(){
  const set = [...new Set(state.rows.map(r=>r.category).filter(Boolean))];
  els.categoryFilter.innerHTML = '<option value="">全部</option>';
  set.forEach(c=>{
    const o=document.createElement('option');
    o.value=c;o.textContent=c;
    els.categoryFilter.appendChild(o);
  });
}

function apply(){
  let data=[...state.rows];

  const k=els.keyword.value.toLowerCase();
  const cat=els.categoryFilter.value;
  const stock=els.stockFilter.value;

  if(k){
    data=data.filter(r=>
      r.code.toLowerCase().includes(k)||
      r.name.toLowerCase().includes(k)
    );
  }

  if(cat){
    data=data.filter(r=>r.category===cat);
  }

  if(stock==='in') data=data.filter(r=>parseNum(r.qty)>0);
  if(stock==='zero') data=data.filter(r=>parseNum(r.qty)===0);
  if(stock==='low') data=data.filter(r=>parseNum(r.qty)<=10 && parseNum(r.qty)>0);

  if(els.sortBy.value==='qtyDesc') data.sort((a,b)=>b.qty-a.qty);
  if(els.sortBy.value==='qtyAsc') data.sort((a,b)=>a.qty-b.qty);
  if(els.sortBy.value==='codeDesc') data.sort((a,b)=>b.code.localeCompare(a.code));

  state.filtered=data;
  render();
}

function render(){
  if(!state.filtered.length){
    els.tableBody.innerHTML='<tr><td colspan="4" class="text-center">無資料</td></tr>';
    return;
  }

  els.tableBody.innerHTML = state.filtered.map(r=>`
    <tr>
      <td>${r.code}</td>
      <td>${r.qty}</td>
      <td>${r.name}</td>
      <td>${r.category}</td>
    </tr>
  `).join('');
}

[els.keyword,els.categoryFilter,els.stockFilter,els.sortBy].forEach(el=>{
  el.addEventListener('input',apply);
  el.addEventListener('change',apply);
});

load();
</script>

</body>
</html>
